name: news auto-update

on:
  schedule:
    - cron: "17 6 * * *"  # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-releases:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate news entries for new package releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_news.py

      - name: Open pull request for any new entries
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "news: add entries for new package releases"
          branch: news/auto-updates
          delete-branch: true
          title: "News: new PySAL package release(s)"
          body: |
            Auto-generated by `scripts/generate_news.py` after detecting new
            GitHub releases for one or more PySAL packages.

            Review the generated description(s) below and edit before
            merging if a richer summary is warranted.
          labels: news, automated
          add-paths: content/news/*.md
